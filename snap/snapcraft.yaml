name: diminutivecoin
base: core22
adopt-info: diminutivecoin
license: MIT
icon: snap/gui/icon.png
summary: Hybrid PoW/PoS cryptocurrency - wallet, full node and staking client
description: |
  Diminutivecoin is a decentralised digital currency with near-instant
  transactions and negligible fees. It secures its chain with a hybrid of
  proof-of-work mining and Proof of Stake 3.1 (PoSV3), the staking design
  introduced by the Blackcoin developers, and is built on Bitcoin Core 0.13.2
  with patches from later releases.

  Leave a balance in an unlocked wallet and it stakes - earning rewards on a
  few watts rather than a few hundred, with no dedicated hardware.

  **What's included**

  * `diminutivecoin.qt` - the desktop wallet, also in your applications menu
  * `diminutivecoin.daemon` - background full node, run as a service
  * `diminutivecoin.cli` - JSON-RPC client for scripting and automation
  * `diminutivecoin.tx` - transaction utility

  **Running the node in the background**

  The daemon is installed disabled, so nothing starts syncing until you ask:

      sudo snap start --enable diminutivecoin.daemon
      sudo snap logs -f diminutivecoin.daemon

  **Where your wallet file is kept**

      ~/snap/diminutivecoin/current/.diminutivecoin

  Snap packages keep their files in their own folder, so this is not the usual
  ~/.diminutivecoin. Your wallet is `wallet.dat` inside that folder - that is
  the file to back up. Press Ctrl+H in the file manager to show hidden folders.

  If you already run Diminutivecoin from the downloaded release, this snap is a
  separate node: it syncs its own copy of the chain and will not see your
  existing wallet.

  **First run**

  The wallet downloads and verifies the full chain before your balance is
  accurate. Leave it running until it reports being in sync.

  Website: https://diminutivecoin.com
  Source and issues: https://github.com/MadCatMining/DiminutiveCoin

grade: stable
confinement: strict
compression: lzo

# The source is architecture-clean: every x86 intrinsic path is guarded
# (crypto/sha256_sse4.cpp on __x86_64__, crypto/scrypt-sse2.cpp on USE_SSE2,
# which is off by default), and the SSE4.1/AVX2/SHA-NI objects are gated by
# compile-flag probes that simply fail elsewhere. configure.ac carries an
# ARM CRC path of its own. Other architectures should build unchanged - add
# them here once one has actually been built and run.
architectures:
  - build-on: [amd64]
  - build-on: [arm64]

apps:
  qt:
    command: bin/diminutivecoin-qt
    desktop: usr/share/applications/diminutivecoin-qt.desktop
    extensions: [kde-neon]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - opengl

  daemon:
    command: bin/diminutivecoind
    daemon: simple
    # Installed disabled: starting a node before the user has written a
    # diminutivecoin.conf would sync the whole chain unannounced.
    install-mode: disable
    restart-condition: always
    plugs:
      - network
      - network-bind
      - home
      - removable-media

  diminutivecoind:
    command: bin/diminutivecoind
    plugs:
      - network
      - network-bind
      - home
      - removable-media

  cli:
    command: bin/diminutivecoin-cli
    plugs:
      - network
      - home
      - removable-media

  tx:
    command: bin/diminutivecoin-tx
    plugs:
      - home
      - removable-media

parts:
  # Berkeley DB 6.2 is not packaged by Ubuntu, and the version matters: a
  # wallet written by a build linked against a different BDB is not portable
  # to the released binaries. Version and hash are kept in step with
  # depends/packages/bdb.mk.
  bdb:
    plugin: nil
    source: https://source.ipfire.org/source-2.x/db-6.2.38.tar.gz
    source-checksum: sha256/99ccd944ffcccc88c0f404b4f3d8cb10747e1e3dfe9ec566f518725f986ca2fd
    build-packages:
      - g++
      - make
    override-build: |
      cd build_unix
      ../dist/configure \
        --prefix=/usr \
        --enable-cxx \
        --disable-shared \
        --disable-replication \
        --with-pic \
        CFLAGS="-Wno-error=implicit-function-declaration" \
        CXXFLAGS="-std=c++17"
      make -j"$CRAFT_PARALLEL_BUILD_COUNT" libdb_cxx-6.2.a libdb-6.2.a
      make install_include install_lib DESTDIR="$CRAFT_PART_INSTALL"
    prime:
      # Static only; nothing from this part belongs in the payload.
      - -*

  diminutivecoin:
    plugin: nil
    source: .
    after: [bdb]
    build-packages:
      - autoconf
      - automake
      - build-essential
      - libboost-chrono-dev
      - libboost-filesystem-dev
      - libboost-program-options-dev
      - libboost-random-dev
      - libboost-system-dev
      - libboost-thread-dev
      - libevent-dev
      - libminiupnpc-dev
      - libprotobuf-dev
      - libqrencode-dev
      - libssl-dev
      - libtool
      - libzmq3-dev
      - pkg-config
      - protobuf-compiler
      - qtbase5-dev
      - qttools5-dev
      - qttools5-dev-tools
    stage-packages:
      - libboost-chrono1.74.0
      - libboost-filesystem1.74.0
      - libboost-program-options1.74.0
      - libboost-random1.74.0
      - libboost-system1.74.0
      - libboost-thread1.74.0
      - libevent-2.1-7
      - libevent-pthreads-2.1-7
      - libminiupnpc17
      - libprotobuf23
      - libqrencode4
      - libssl3
      - libzmq5
    override-pull: |
      craftctl default
      # Track the tag the tree was built from, so a store upload is labelled
      # with the release it actually contains.
      version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
      if [ -z "$version" ]; then
        version="$(sed -n 's/^define(_CLIENT_VERSION_MAJOR, \(.*\))$/\1/p' configure.ac).$(sed -n 's/^define(_CLIENT_VERSION_MINOR, \(.*\))$/\1/p' configure.ac).$(sed -n 's/^define(_CLIENT_VERSION_BUILD, \(.*\))$/\1/p' configure.ac)"
      fi
      craftctl set version="$version"
    override-build: |
      ./autogen.sh
      ./configure \
        --prefix=/usr \
        --disable-tests \
        --disable-bench \
        --disable-dependency-tracking \
        --enable-reduce-exports \
        --with-gui=qt5 \
        --with-daemon \
        --with-utils \
        BDB_LIBS="-L$CRAFT_STAGE/usr/lib -ldb_cxx-6.2" \
        BDB_CFLAGS="-I$CRAFT_STAGE/usr/include"
      make -j"$CRAFT_PARALLEL_BUILD_COUNT"
      make install DESTDIR="$CRAFT_PART_INSTALL"
      # Binaries are installed under /usr/bin; the app commands above expect
      # bin/, which snapd resolves against $SNAP.
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      for b in diminutivecoind diminutivecoin-cli diminutivecoin-tx diminutivecoin-qt; do
        ln -sf ../usr/bin/"$b" "$CRAFT_PART_INSTALL/bin/$b"
      done
      # The build does not install the icons, so place them by hand for the
      # Icon= entry in the desktop file.
      for size in 16 32 64 128 256; do
        d="$CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps"
        mkdir -p "$d"
        cp share/pixmaps/bitcoin${size}.png "$d/diminutivecoin.png"
      done

  launcher:
    plugin: dump
    source: contrib/snap
    organize:
      diminutivecoin-qt.desktop: usr/share/applications/diminutivecoin-qt.desktop
    prime:
      - usr/share/applications/*
